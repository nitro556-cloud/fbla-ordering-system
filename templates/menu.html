<h1>Menu test</h1>

<form action="/menu" method="get">
  <input type="text" name="q" value="{{ query }}" placeholder="Search...">
  <button type="submit">Search</button>
</form>

{% for item in menu %}
  <p>{{ item.name }} - ${{ item.price }} - {{ item.category }} - stock: {{ item.stock }}</p>
{% endfor %}
